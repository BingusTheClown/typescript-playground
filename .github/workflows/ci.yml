name: CI Pipeline

# Trigger the workflow on pushes or pull requests to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Run Linters
    uses: ./.github/workflows/lint.yml

  run-unit-tests:
    name: Run Unit tests
    uses: ./.github/workflows/run-integration-tests.yml

  run-integration-tests:
    name: Run Integration tests
    uses: ./.github/workflows/run-integration-tests.yml