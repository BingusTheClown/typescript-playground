name: CI Pipeline

# Trigger the workflow on pushes or pull requests to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  lint:
    name: Run Linters
    uses: ./.github/workflows/lint.yml

  test-unit:
      - name: Run Unit tests
        run: ./.github/workflows/run-integration-tests.yml

  test-integration:
      - name: Run Integration tests
        run: ./.github/workflows/run-integration-tests.yml