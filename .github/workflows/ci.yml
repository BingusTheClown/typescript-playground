name: CI Pipeline

# Trigger the workflow on pushes or pull requests to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    # Use a GitHub-hosted Linux runner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm' # Options: 'npm', 'yarn', 'pnpm'  

      - name: Install dependencies
        run: npm ci    

      - name: ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test
